spring:
  application:
    name: merkado
  datasource:
#    url: jdbc:postgresql://localhost:5432/merkado?currentSchema=prod
    url: ${DB_URL:jdbc:postgresql://localhost:5432/merkado}
    username: ${DB_USERNAME:merkado_user}
    password: ${DB_PASSWORD:merkado_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#        default_schema: prod

  flyway:
    enabled: true
    locations: classpath:db/migration


  jackson:
    serialization:
      indent-output: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:6H6nPz6s3cN6z3Y7X6bQ5fP4mD8rR2wT9kL7aN5vM1xC8sF4}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7

logging:
  file:
    name: logs/application.log
  level:
    root: info
    biz.michael_maldo.merkado: debug
